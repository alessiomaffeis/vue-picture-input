name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: [locked, '3.5.0']
    name: Vue ${{ matrix.vue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install minimum supported Vue
        if: matrix.vue == '3.5.0'
        run: npm install --no-save --package-lock=false vue@3.5.0
      - name: Report Vue version
        run: node -p "require('vue/package.json').version"
      - name: Assert minimum Vue runtime and compiler
        if: matrix.vue == '3.5.0'
        run: node -e "const assert = require('node:assert/strict'); assert.equal(require('vue/package.json').version, '3.5.0'); assert.equal(require('vue/compiler-sfc').version, '3.5.0');"
      - run: npm test
      - run: git diff --exit-code -- package.json package-lock.json
  browser:
    name: Chromium (locked Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
